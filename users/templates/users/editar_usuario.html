{% extends 'base.html' %}
{% load static %}

{% block css_files %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/editar_usuario.css' %}">
{% endblock %}

{% block content %}
<div class="edit-user-container">
    <h2>Editar Usuario: {{ user.persona.nombres }} {{ user.persona.apellidos }}</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar Cambios</button>
    </form>
    
    <br>
    <a href="{% url 'detalle_usuario' user.id %}" class="back-link">← Volver al Detalle del Usuario</a>
</div>
{% endblock %}
