{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Eliminar Amenidad</h2>
    <p>¿Estás seguro de que quieres eliminar la amenidad "{{ amenidad.nombre }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'gestionar_amenidades' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
