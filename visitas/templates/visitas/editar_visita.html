{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}
<div class="edit-user-container">

        {{ form.as_p }}

    <a href="{% url 'detalle_visita' visita.id %}" class="back-link">← Volver al Detalle de la Visita</a>

{% endblock %}
