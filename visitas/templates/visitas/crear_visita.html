{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">Registrar Nueva Visita</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar Visita</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'lista_visitas' %}" class="back-link">← Volver a la Lista</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const propiedadSelect = document.getElementById('id_propiedad');
        const residenteSelect = document.getElementById('id_residente_autoriza');

        propiedadSelect.addEventListener('change', function() {
            const propiedadId = this.value;
            if (propiedadId) {
                fetch(`/visitas/propiedad/${propiedadId}/residentes/`)
                    .then(response => response.json())
                    .then(data => {
                        residenteSelect.innerHTML = '<option value="">---------</option>';
                        data.forEach(residente => {
                            const option = new Option(residente.nombre, residente.id);
                            residenteSelect.add(option);
                        });
                    });
            } else {
                residenteSelect.innerHTML = '<option value="">---------</option>';
            }
        });
    });
</script>
{% endblock scripts %}
