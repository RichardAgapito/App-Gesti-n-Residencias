{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center">Registrar Nueva Visita</h1>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_usuario_registra">Usuario Registra</label>
                    <p id="id_usuario_registra" class="form-control" style="background-color: #e9ecef;">{{ request.user }}</p>
                </div>
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Guardar Visita</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'lista_visitas' %}" class="back-link">← Volver a la Lista</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const propiedadSelect = document.getElementById('id_propiedad');
        const residenteSelect = document.getElementById('id_residente_autoriza');

        if (propiedadSelect && residenteSelect) {
            propiedadSelect.addEventListener('change', function() {
                const propiedadId = this.value;
                
                // Limpiar el select de residentes
                residenteSelect.innerHTML = '<option value="">---------</option>';
                
                if (propiedadId) {
                    // CORREGIDA LA URL: removido el prefijo /visitas/
                    fetch(`/visitas/propiedad/${propiedadId}/residentes/`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Error en la respuesta del servidor');
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (data.length === 0) {
                                const option = new Option('(No hay residentes activos)', '');
                                option.disabled = true;
                                residenteSelect.add(option);
                            } else {
                                data.forEach(residente => {
                                    const option = new Option(residente.nombre, residente.id);
                                    residenteSelect.add(option);
                                });
                            }
                        })
                        .catch(error => {
                            console.error('Error al cargar residentes:', error);
                            const option = new Option('(Error al cargar residentes)', '');
                            option.disabled = true;
                            residenteSelect.add(option);
                        });
                }
            });
        }
    });
</script>
{% endblock scripts %}
