{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}
<div class="form-container">
    <h1>Registrar Nueva Pre-Autorización</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar Pre-Autorización</button>
    </form>
    <a href="{% url 'lista_preautorizaciones' %}" class="back-link">← Volver a la Lista</a>
</div>
{% endblock %}
