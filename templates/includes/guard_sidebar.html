<aside class="hidden lg:block w-64 bg-white border-r border-gray-200 h-screen fixed left-0 top-0 overflow-y-auto z-50 custom-scrollbar">
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-building text-blue-600 text-2xl"></i>
            <span class="text-xl font-bold text-gray-800">ResidencialApp</span>
        </div>
    </div>

    <nav class="p-4 space-y-2">
        
        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:no-underline {% if request.resolver_match.url_name == 'dashboard_visitas' %}bg-blue-50 text-blue-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-table-columns w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Dashboard</span>
        </a>

        <div class="pt-4 pb-2 px-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Control de Acceso</span>
        </div>

        <!-- Visitantes -->
        <a href="{% url 'lista_visitantes' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:no-underline {% if 'visitante' in request.resolver_match.url_name and 'lista' in request.resolver_match.url_name %}bg-blue-50 text-blue-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-users w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Visitantes</span>
        </a>

        <!-- Visitas -->
        <a href="{% url 'lista_visitas' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:no-underline {% if 'visita' in request.resolver_match.url_name and 'visitante' not in request.resolver_match.url_name and request.resolver_match.url_name != 'dashboard_visitas' %}bg-blue-50 text-blue-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-car w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Registro de Visitas</span>
        </a>

        <!-- Pre-Autorizaciones -->
        <a href="{% url 'lista_preautorizaciones' %}"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors hover:no-underline {% if 'preautorizaciones' in request.resolver_match.url_name %}bg-blue-50 text-blue-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-calendar-check w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Pre-Autorizaciones</span>
        </a>

        <!-- Footer / Logout -->
        <div class="pt-4 mt-4 border-t border-gray-200 space-y-2">

            <form method="post" action="{% url 'logout' %}" class="w-full">
                {% csrf_token %}
                <button type="submit"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-colors text-left">
                    <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                    <span class="font-medium whitespace-nowrap">Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </nav>
</aside>
