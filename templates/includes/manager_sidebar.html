<aside class="hidden lg:block w-64 bg-white border-r border-gray-200 h-screen fixed left-0 top-0 overflow-y-auto z-30">
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-building-user text-indigo-600 text-2xl"></i>
            <span class="text-xl font-bold text-gray-800">Panel Gerente</span>
        </div>
    </div>
    
    <nav class="p-4 space-y-2">
        <a href="{% url 'dashboard' %}" 
           class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-indigo-50 text-indigo-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-table-columns w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Dashboard</span>
        </a>

        <!-- "Gestionar Complejos" removed for Manager -->

        <a href="{% url 'gestionar_amenidades' %}" 
           class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors {% if 'amenidad' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-star w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Gestionar Amenidades</span>
        </a>

        <a href="{% url 'admin_reservas' %}" 
           class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors {% if 'reserva' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            <i class="fa-solid fa-calendar-days w-5 text-center"></i>
            <span class="font-medium whitespace-nowrap">Gestionar Reservas</span>
        </a>

        <!-- Finanzas Accordion -->
        <div class="space-y-1">
            <button onclick="toggleFinanzas()" 
                    class="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-lg transition-colors text-gray-700 hover:bg-gray-50">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-dollar-sign w-5 text-center"></i>
                    <span class="font-medium whitespace-nowrap">Finanzas</span>
                </div>
                <i id="finanzas-icon" class="fa-solid fa-chevron-down text-xs transition-transform"></i>
            </button>
            
            <div id="finanzas-menu" class="max-h-0 opacity-0 overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] pl-4 space-y-1">
                <a href="{% url 'lista_planes_cuota' %}" 
                   class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {% if 'planes_cuota' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-center text-xs"></i>
                    <span class="text-sm whitespace-nowrap">Planes de Cuota</span>
                </a>

                <a href="{% url 'lista_conceptos_cobro' %}" 
                   class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {% if 'conceptos_cobro' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                    <i class="fa-solid fa-tags w-5 text-center text-xs"></i>
                    <span class="text-sm whitespace-nowrap">Conceptos de Cobro</span>
                </a>

                <a href="{% url 'lista_metodos_pago' %}" 
                   class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {% if 'metodos_pago' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                    <i class="fa-solid fa-credit-card w-5 text-center text-xs"></i>
                    <span class="text-sm whitespace-nowrap">Métodos de Pago</span>
                </a>

                <a href="{% url 'lista_facturas' %}" 
                   class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {% if 'facturas' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                    <i class="fa-solid fa-file-invoice w-5 text-center text-xs"></i>
                    <span class="text-sm whitespace-nowrap">Gestionar Facturas</span>
                </a>

                <a href="{% url 'reporte_cobranza' %}" 
                   class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {% if 'reporte_cobranza' in request.resolver_match.url_name %}bg-indigo-50 text-indigo-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                    <i class="fa-solid fa-chart-line w-5 text-center text-xs"></i>
                    <span class="text-sm whitespace-nowrap">Reporte de Cobranza</span>
                </a>
            </div>
        </div>

        <div class="pt-4 mt-4 border-t border-gray-200 space-y-2">
            <!-- Dev Panel removed for Manager -->
            
            <form method="post" action="{% url 'logout' %}" class="w-full">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-colors text-left">
                    <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                    <span class="font-medium whitespace-nowrap">Cerrar Sesión</span>
                </button>
            </form>
        </div>
    </nav>

    <script>
        function toggleFinanzas() {
            const menu = document.getElementById('finanzas-menu');
            const icon = document.getElementById('finanzas-icon');
            
            if (menu.classList.contains('max-h-0')) {
                // Open
                menu.classList.remove('max-h-0', 'opacity-0');
                menu.classList.add('max-h-[400px]', 'opacity-100');
                icon.classList.add('rotate-180');
            } else {
                // Close
                menu.classList.remove('max-h-[400px]', 'opacity-100');
                menu.classList.add('max-h-0', 'opacity-0');
                icon.classList.remove('rotate-180');
            }
        }

        // Auto-open if we're on a finanzas page
        document.addEventListener('DOMContentLoaded', function() {
            const finanzasPages = ['planes_cuota', 'conceptos_cobro', 'metodos_pago', 'facturas', 'reporte_cobranza'];
            const currentUrl = window.location.pathname;
            
            if (finanzasPages.some(page => currentUrl.includes(page))) {
                const menu = document.getElementById('finanzas-menu');
                const icon = document.getElementById('finanzas-icon');
                menu.classList.remove('max-h-0', 'opacity-0');
                menu.classList.add('max-h-[400px]', 'opacity-100');
                icon.classList.add('rotate-180');
            }
        });
    </script>
</aside>
